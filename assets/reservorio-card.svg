<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Reservoir outlet with a 45 degree drop: the pipe runs partly full, so the electromagnetic flowmeter over-reads">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d141b"/><stop offset="1" stop-color="#080d12"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#19d3bd"/><stop offset="1" stop-color="#05524a"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3a4550"/><stop offset="1" stop-color="#27313a"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffb060"/><stop offset="1" stop-color="#ff8000"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#ff8000" stop-opacity="0.45"/><stop offset="1" stop-color="#ff8000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="xsec"><circle cx="640" cy="128" r="62"/></clipPath>
  </defs>

  <!-- background + grid -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800M0 450H800"/>
    <path d="M50 0V500M100 0V500M150 0V500M200 0V500M250 0V500M300 0V500M350 0V500M400 0V500M450 0V500M500 0V500M550 0V500M600 0V500M650 0V500M700 0V500M750 0V500"/>
  </g>

  <!-- reservoir -->
  <rect x="28" y="120" width="150" height="196" rx="6" fill="url(#concrete)"/>
  <rect x="42" y="134" width="122" height="168" rx="3" fill="#0a1117"/>
  <rect x="42" y="168" width="122" height="134" rx="3" fill="url(#water)" fill-opacity="0.85"/>
  <path d="M42 170q15 -6 30 0t30 0t30 0t32 0" stroke="#bdfff5" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
  <text x="103" y="108" fill="#8c949c" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">RESERVOIR</text>

  <!-- horizontal outlet: pipe wall, air on top, water below -->
  <rect x="176" y="264" width="300" height="40" fill="#1d2a33"/>
  <rect x="176" y="278" width="300" height="26" fill="url(#water)"/>
  <path d="M176 279q20 -4 40 0t40 0t40 0t40 0t40 0t40 0t40 0t24 0" stroke="#bdfff5" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="176" y="260" width="300" height="4" fill="#5b6873"/>
  <rect x="176" y="304" width="300" height="4" fill="#5b6873"/>
  <!-- flow chevrons in the water -->
  <g stroke="#eafffb" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M220 287l7 6-7 6"/><path d="M420 287l7 6-7 6"/>
  </g>

  <!-- 45° drop (supercritical thin layer) -->
  <g stroke-linecap="butt">
    <path d="M474 284 Q 506 284 528 306 L 724 502" stroke="#5b6873" stroke-width="48"/>
    <path d="M474 284 Q 506 284 528 306 L 724 502" stroke="#1d2a33" stroke-width="40"/>
    <path d="M474 296 Q 500 296 520 316 L 712 508" stroke="url(#water)" stroke-width="12"/>
  </g>
  <!-- 45° angle mark -->
  <path d="M540 318H612" stroke="#8c949c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M596 318a56 56 0 0 1 -14 38" stroke="#ffc107" stroke-width="2"/>
  <text x="614" y="352" fill="#ffc107" font-family="DM Sans, system-ui, sans-serif" font-size="16" font-weight="700">45°</text>

  <!-- electromagnetic flowmeter (the suspect) -->
  <circle cx="320" cy="262" r="110" fill="url(#hot)"/>
  <rect x="282" y="250" width="12" height="68" rx="3" fill="#ff8000"/>
  <rect x="346" y="250" width="12" height="68" rx="3" fill="#ff8000"/>
  <rect x="294" y="256" width="52" height="56" rx="8" fill="url(#meter)" fill-opacity="0.9"/>
  <rect x="312" y="234" width="16" height="22" fill="#c56200"/>
  <rect x="286" y="182" width="68" height="54" rx="9" fill="#1a222a" stroke="#ff8000" stroke-width="2"/>
  <rect x="294" y="190" width="52" height="28" rx="3" fill="#0a1117"/>
  <text x="320" y="209" fill="#ff8a8a" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">78.0</text>
  <text x="320" y="230" fill="#8c949c" font-family="DM Sans, system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">L/s</text>
  <!-- section mark A–A -->
  <path d="M320 324V340" stroke="#ffc107" stroke-width="2"/>
  <text x="320" y="356" fill="#ffc107" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">A–A</text>

  <!-- cross-section inset at the sensor -->
  <path d="M352 232 L 574 150" stroke="#ffc107" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 5"/>
  <circle cx="640" cy="128" r="72" fill="#0a1117" stroke="#2e7cd6" stroke-width="10"/>
  <g clip-path="url(#xsec)">
    <rect x="570" y="58" width="140" height="140" fill="#1d2a33"/>
    <rect x="570" y="107" width="140" height="103" fill="url(#water)"/>
    <path d="M570 108q18 -4 36 0t36 0t36 0t36 0" stroke="#bdfff5" stroke-opacity="0.7" stroke-width="2"/>
    <g fill="#bdfff5" fill-opacity="0.55">
      <circle cx="612" cy="166" r="3"/><circle cx="660" cy="176" r="2.5"/><circle cx="638" cy="158" r="2"/>
    </g>
  </g>
  <text x="640" y="92" fill="#ff8a8a" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">AIR</text>
  <!-- electrodes at 3 and 9 o'clock, EPD on top -->
  <circle cx="568" cy="128" r="6" fill="#19d3bd" stroke="#0a1117" stroke-width="2"/>
  <circle cx="712" cy="128" r="6" fill="#19d3bd" stroke="#0a1117" stroke-width="2"/>
  <circle cx="640" cy="56" r="6" fill="#ff5a5a" stroke="#0a1117" stroke-width="2"/>

  <!-- readout chips: real vs indicated -->
  <g font-family="DM Sans, system-ui, sans-serif" font-weight="700">
    <rect x="40" y="356" width="150" height="50" rx="10" fill="#0a1117" stroke="#19d3bd" stroke-opacity="0.45"/>
    <text x="54" y="376" fill="#8c949c" font-size="10" letter-spacing="1.5">REAL FLOW</text>
    <text x="54" y="397" fill="#19d3bd" font-size="17">57.9 L/s</text>
    <rect x="204" y="356" width="168" height="50" rx="10" fill="#0a1117" stroke="#ff8000" stroke-opacity="0.6"/>
    <text x="218" y="376" fill="#8c949c" font-size="10" letter-spacing="1.5">METER READS</text>
    <text x="218" y="397" fill="#ff8000" font-size="17">78.0 L/s  +35%</text>
  </g>

  <!-- caption -->
  <g font-family="DM Sans, system-ui, sans-serif" font-weight="700">
    <text x="40" y="448" fill="#ff8000" font-size="15" letter-spacing="2">PARTLY FULL PIPE</text>
    <text x="40" y="476" fill="#19d3bd" font-size="13" letter-spacing="1.5" font-weight="500">real hydraulics → why the flowmeter over-reads</text>
  </g>
</svg>
