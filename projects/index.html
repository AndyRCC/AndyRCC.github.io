        <ul class="noscript-list">
          <li>
            <h2><a class="ul" href="https://andyrcc.github.io/HydraDetect-AI/" target="_blank" rel="noopener">HydraDetect-AI</a></h2>
            <p>Detects clandestine water taps in city pipes using a controlled water hammer and machine learning. Lab-to-field transfer reaches 89% accuracy, running offline on an Arduino edge device.</p>
          </li>
          <li>
            <h2><a class="ul" href="https://andyrcc.github.io/simulacion-reservorio-3d/" target="_blank" rel="noopener">Reservoir Outlet 3D</a></h2>
            <p>Interactive 3D hydraulics (Manning, H2/H3/S2 profiles): why a partly full pipe makes an electromagnetic flowmeter over-read by about 35%, and how a gooseneck fixes it.</p>
          </li>
          <li>
            <h2><a class="ul" href="https://andyrcc.github.io/contrastacion-emapica/" target="_blank" rel="noopener">Bulk Meter Verification</a></h2>
            <p>53 bulk water meters at a utility’s wells and reservoirs, checked against a portable clamp-on ultrasonic reference. 41 tested on site; 15 corrected in the field without cutting supply, all re-verified.</p>
          </li>
          <li>
            <h2><a class="ul" href="https://github.com/AndyRCC/erdos-straus" target="_blank" rel="noopener">Erdős–Straus: Blind Sets</a> · <a class="ul" href="https://doi.org/10.5281/zenodo.24569380" target="_blank" rel="noopener">DOI</a></h2>
            <p>For every shift c ≡ 3 (mod 4), counts the primes where that shift fails, settling the open case c = 3, plus exact computations for 128 million “hard” primes below 10¹¹. Not a proof of the conjecture.</p>
          </li>
          <li>
            <h2><a class="ul" href="https://github.com/AndyRCC/bsd-period-trace-audit" target="_blank" rel="noopener">BSD Period–Trace Audit</a> · <a class="ul" href="https://doi.org/10.5281/zenodo.24450625" target="_blank" rel="noopener">DOI</a></h2>
            <p>Independent audit of reported correlations among elliptic curves (Cremona data, N &lt; 10⁵): a collider and a Simpson reversal explain them. Also found a documentation error in Cremona’s ecdata, now fixed upstream.</p>
          </li>
          <li>
            <h2><a class="ul" href="https://github.com/AndyRCC/hoardling" target="_blank" rel="noopener">Hoardling</a></h2>
            <p>A tiny Windows desktop dragon that keeps an eye on my Claude Code and Antigravity usage limits: glasses on while they work, napping when they’re closed. Local-only, no telemetry.</p>
          </li>
        </ul>
